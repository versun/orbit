<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="sunBody" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFE3A6"/>
      <stop offset="45%" stop-color="#FFC65C"/>
      <stop offset="100%" stop-color="#F0932B"/>
    </radialGradient>
    <radialGradient id="bead" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#C9EAFF"/>
      <stop offset="55%" stop-color="#8BD3FF"/>
      <stop offset="100%" stop-color="#4E9FE8"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0D0E24" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- orbit ring -->
  <ellipse cx="48" cy="50" rx="41" ry="16.5" fill="none" stroke="#B9BCE8" stroke-opacity="0.85" stroke-width="4.5" stroke-linecap="round" transform="rotate(-18 48 50)"/>
  <!-- clay sun ball -->
  <circle cx="48" cy="48" r="24" fill="url(#sunBody)" filter="url(#soft)"/>
  <!-- cream highlight -->
  <ellipse cx="40" cy="39" rx="8.5" ry="6" fill="#FFF3D6" opacity="0.85" transform="rotate(-20 40 39)"/>
  <!-- little blue clay bead on the ring -->
  <circle cx="80.5" cy="33.5" r="7.2" fill="url(#bead)" filter="url(#soft)"/>
  <ellipse cx="78.2" cy="31" rx="2.4" ry="1.7" fill="#EAF7FF" opacity="0.9" transform="rotate(-25 78.2 31)"/>
</svg>
